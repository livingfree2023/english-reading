<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>双语精读 · 中英对照资料库</title>
<meta name="description" content="中英双语精读材料：英文原文、逐段中文对照、生词悬停注音。">
<style>
  :root{
    --bg:#fbfaf7;
    --paper:#ffffff;
    --ink:#1c1b19;
    --ink-soft:#4a4744;
    --zh:#2f4f6f;
    --accent:#8b1e1e;
    --gold:#a8842c;
    --rule:#e6e1d8;
    --chip:#f4f1ea;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    line-height:1.7;
  }
  .wrap{max-width:720px;margin:0 auto;padding:0 24px 72px}

  header.hd{padding:44px 0 20px;border-bottom:3px double var(--rule)}
  .kicker{
    font-size:11px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--gold);margin:0 0 8px;
  }
  h1{
    font-family:Georgia,"Times New Roman",serif;
    font-size:26px;line-height:1.3;margin:0;font-weight:600;
  }
  h1 small{
    display:block;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    font-size:13.5px;font-weight:400;color:var(--ink-soft);margin-top:7px;letter-spacing:.03em;
  }

  .list{margin:0;padding:0;list-style:none}

  .card{
    display:block;
    margin-top:16px;
    padding:18px 20px 17px;
    background:var(--paper);
    border:1px solid var(--rule);
    border-radius:10px;
    text-decoration:none;color:inherit;
    transition:border-color .15s,box-shadow .15s,transform .15s;
  }
  .card:hover{
    border-color:var(--gold);
    box-shadow:0 6px 18px rgba(40,32,18,.08);
    transform:translateY(-1px);
  }
  .card:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  .top{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
  .idx{
    font-family:Georgia,serif;font-size:11px;letter-spacing:.14em;
    color:var(--gold);flex:none;
  }
  .go{
    margin-left:auto;font-size:12.5px;color:var(--accent);flex:none;
    opacity:0;transform:translateX(-4px);transition:.15s;
  }
  .card:hover .go,.card:focus-visible .go{opacity:1;transform:translateX(0)}

  .card h2{
    font-family:Georgia,"Times New Roman",serif;
    font-size:19px;line-height:1.4;margin:0 0 3px;font-weight:600;
  }
  .orig{
    margin:0 0 9px;font-size:13px;line-height:1.5;color:var(--zh);
    font-family:Georgia,"Times New Roman",serif;font-style:italic;
  }
  .meta{margin:0 0 11px;font-size:12.5px;color:var(--ink-soft)}
  .meta b{color:var(--ink);font-weight:600}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin:0}
  .tags span{
    font-size:11.5px;line-height:1;padding:4px 8px;
    background:var(--chip);color:var(--ink-soft);border-radius:999px;
  }

  footer.ft{
    margin-top:28px;font-size:11.5px;color:#8d887e;line-height:1.8;
  }

  @media (max-width:640px){
    .wrap{padding:0 16px 56px}
    h1{font-size:22px}
    .card{padding:15px 16px}
    .card h2{font-size:17px}
    .go{opacity:1;transform:none}
  }
</style>
</head>
<body>
<div class="wrap">

<header class="hd">
  <p class="kicker">Bilingual Reading · 中英双语精读</p>
  <h1>双语精读
    <small>英文原文 · 逐段中文对照 · 生词悬停显示音标与释义</small>
  </h1>
</header>

<ul class="list">
